*Enables one to unlock camera movement by Z+X before a shot. Controls:
*- C-stick up/down to dolly in/out
*- Z + left stick to pedestal (move up/down) and truck (move left/right)
*- Z + C-stick up/down to tilt
*- Z + C-stick left-right to pan
*
*Specific to practice mode only, you can press Z+X again to drop the ball from the camera's position.
*
*Pressing any button other than the analogue sticks, D-pad and Z button will exit this mode.
